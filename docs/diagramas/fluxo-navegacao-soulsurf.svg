<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160" viewBox="0 0 1700 1160" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de fluxo de navegacao do Soul Surf Mobile</title>
  <desc id="desc">Fluxo principal de telas do aplicativo desde abertura, login, abas principais e telas de detalhe.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#244853" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17313a" flood-opacity="0.14" />
    </filter>
    <style>
      .bg { fill: #f8fbfc; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #18323b; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #52676e; }
      .node { stroke-width: 2.5; filter: url(#shadow); }
      .auth { fill: #fff2d8; stroke: #d9ad4d; }
      .tab { fill: #e7f4f7; stroke: #7fb3c1; }
      .detail { fill: #edf8f0; stroke: #78b986; }
      .admin { fill: #f1eefc; stroke: #9b90d6; }
      .danger { fill: #fef0ef; stroke: #d78179; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #18323b; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #52676e; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #4b626a; font-weight: 700; }
      .arrow { stroke: #244853; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #78929b; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .shell { fill: #ffffff; stroke: #cddde2; stroke-width: 3; filter: url(#shadow); }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1160" />
  <text x="80" y="78" class="title">Fluxo de navegacao - Soul Surf Mobile</text>
  <text x="82" y="118" class="subtitle">Fluxo principal: abertura, autenticacao, abas do app e telas de detalhes.</text>

  <rect x="85" y="190" width="210" height="84" rx="18" class="node auth" />
  <text x="128" y="224" class="text">Abertura</text>
  <text x="126" y="252" class="small">app/index.tsx</text>

  <rect x="380" y="190" width="230" height="84" rx="18" class="node auth" />
  <text x="450" y="224" class="text">Login</text>
  <text x="435" y="252" class="small">/login</text>

  <rect x="350" y="340" width="220" height="82" rx="18" class="node auth" />
  <text x="412" y="374" class="text">Cadastro</text>
  <text x="414" y="401" class="small">/register</text>

  <rect x="620" y="340" width="245" height="82" rx="18" class="node auth" />
  <text x="660" y="374" class="text">Esqueci senha</text>
  <text x="677" y="401" class="small">/forgot-password</text>

  <rect x="910" y="340" width="230" height="82" rx="18" class="node auth" />
  <text x="948" y="374" class="text">Redefinir</text>
  <text x="955" y="401" class="small">/reset-password</text>

  <rect x="85" y="340" width="210" height="82" rx="18" class="node auth" />
  <text x="147" y="374" class="text">Termos</text>
  <text x="143" y="401" class="small">/terms</text>

  <path class="arrow" d="M297 232 L372 232" />
  <text x="310" y="212" class="label">redirect</text>
  <path class="arrow" d="M495 275 L495 333" />
  <text x="510" y="314" class="label">criar conta</text>
  <path class="arrow" d="M610 232 C735 232 735 330 742 333" />
  <text x="650" y="216" class="label">recuperar senha</text>
  <path class="arrow" d="M865 381 L902 381" />
  <path class="arrow-soft" d="M1025 340 C1025 250 620 250 612 245" />
  <text x="1038" y="292" class="label">sucesso</text>
  <path class="arrow-soft" d="M350 381 L303 381" />

  <rect x="165" y="535" width="1370" height="445" rx="28" class="shell" />
  <text x="200" y="585" class="text">Tabs principais - app/(tabs)</text>
  <text x="200" y="616" class="small">Apos login bem-sucedido ou token existente, o app usa router.replace('/map').</text>

  <rect x="230" y="690" width="210" height="86" rx="18" class="node tab" />
  <text x="302" y="724" class="text">Mapa</text>
  <text x="291" y="752" class="small">/map</text>

  <rect x="500" y="690" width="210" height="86" rx="18" class="node tab" />
  <text x="552" y="724" class="text">Descobrir</text>
  <text x="552" y="752" class="small">/discover</text>

  <rect x="770" y="690" width="210" height="86" rx="18" class="node tab" />
  <text x="833" y="724" class="text">Chat</text>
  <text x="829" y="752" class="small">/chat</text>

  <rect x="1040" y="690" width="210" height="86" rx="18" class="node tab" />
  <text x="1075" y="724" class="text">Notificacoes</text>
  <text x="1089" y="752" class="small">/notifications</text>

  <rect x="1310" y="690" width="170" height="86" rx="18" class="node tab" />
  <text x="1352" y="724" class="text">Perfil</text>
  <text x="1348" y="752" class="small">/profile</text>

  <path class="arrow" d="M495 275 C495 520 335 520 335 682" />
  <text x="520" y="505" class="label">login OK / token salvo</text>

  <rect x="210" y="1025" width="230" height="82" rx="18" class="node detail" />
  <text x="252" y="1059" class="text">Detalhe praia</text>
  <text x="266" y="1086" class="small">/beach/[id]</text>

  <rect x="510" y="1025" width="245" height="82" rx="18" class="node detail" />
  <text x="561" y="1059" class="text">Condicoes</text>
  <text x="545" y="1086" class="small">/beach/[id]/condicoes</text>

  <rect x="825" y="1025" width="220" height="82" rx="18" class="node detail" />
  <text x="874" y="1059" class="text">Post</text>
  <text x="882" y="1086" class="small">/post/[id]</text>

  <rect x="1115" y="1025" width="220" height="82" rx="18" class="node detail" />
  <text x="1168" y="1059" class="text">Usuario</text>
  <text x="1168" y="1086" class="small">/user/[id]</text>

  <rect x="1405" y="1025" width="220" height="82" rx="18" class="node detail" />
  <text x="1456" y="1059" class="text">Conversa</text>
  <text x="1462" y="1086" class="small">/chat/[id]</text>

  <rect x="1290" y="535" width="250" height="82" rx="18" class="node admin" />
  <text x="1348" y="569" class="text">Admin</text>
  <text x="1338" y="596" class="small">/admin</text>

  <rect x="1100" y="535" width="155" height="82" rx="18" class="node danger" />
  <text x="1134" y="569" class="text">Ajustes</text>
  <text x="1134" y="596" class="small">/settings</text>

  <rect x="895" y="535" width="165" height="82" rx="18" class="node detail" />
  <text x="925" y="569" class="text">Editar</text>
  <text x="922" y="596" class="small">/edit-profile</text>

  <path class="arrow" d="M335 777 L325 1017" />
  <text x="258" y="905" class="label">pin de praia</text>
  <path class="arrow" d="M440 1066 L502 1066" />
  <path class="arrow" d="M440 1048 C585 945 805 920 930 1017" />
  <path class="arrow" d="M500 733 C430 840 710 925 930 1017" />
  <path class="arrow" d="M605 777 C655 890 810 945 930 1017" />
  <path class="arrow" d="M930 1025 C990 925 1140 895 1220 1017" />
  <path class="arrow" d="M1040 733 C1088 840 1152 935 1220 1017" />
  <path class="arrow" d="M875 777 C940 900 1355 940 1515 1017" />
  <path class="arrow" d="M1395 777 C1395 860 1515 935 1515 1017" />
  <path class="arrow" d="M1395 690 L1180 618" />
  <path class="arrow" d="M1395 690 L1415 625" />
  <path class="arrow" d="M1395 690 C1300 620 1130 640 980 625" />

  <text x="200" y="660" class="small">Abas: Mapa, Descobrir, Chat, Notificacoes e Perfil</text>
  <text x="220" y="950" class="small">Fluxos de detalhe partem principalmente de pins, cards de post, usuarios, chats e notificacoes.</text>
</svg>
